server {
    listen 8888;
    server_name _;

    server_tokens off;

    root /home/root/scan/webapp/frontend;
    index index.html;

    access_log /home/root/scan/webapp/logs/access.log;
    error_log  /home/root/scan/webapp/logs/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSE streaming endpoint - special config
    location ~ ^/api/scan/[^/]+/events$ {
        proxy_pass         http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection "";

        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;

        # CRITICAL for SSE: disable all buffering
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;

        add_header Content-Type       "text/event-stream" always;
        add_header Cache-Control      "no-cache" always;
        add_header X-Accel-Buffering  "no" always;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # API proxy -> Python backend
    location /api/ {
        proxy_pass         http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering    off;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
